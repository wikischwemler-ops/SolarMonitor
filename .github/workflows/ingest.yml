name: Messwerte einsammeln

# Der ESP32 schickt alle 10 min ein repository_dispatch mit den Messzeilen und Verbindungswerten.
on:
  repository_dispatch:
    types: [solar-data]
  workflow_dispatch:
    inputs:
      rows:
        description: "Testzeilen (ts,p,u,i,f,t,u1,i1,u2,i2,e_day,e_total[,rssi,ap,lat]; getrennt durch ;)"
        required: true

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Zeilen uebernehmen
        env:
          # Nie direkt ins Skript interpolieren (Injection) – nur per Umgebungsvariable
          ROWS: ${{ github.event.client_payload.rows || inputs.rows }}
          NET: ${{ github.event.client_payload.net }}
          ST: ${{ github.event.client_payload.st }}
          IP: ${{ github.event.client_payload.ip }}
        run: python3 tools/ingest.py

      - name: Commit
        run: |
          git config user.name "solar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "nichts Neues"; exit 0; fi
          git commit -q -m "Messwerte $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q
          done
          exit 1
