; ESP32-WROOM-32 Collector fuer Bosswerk BW-MI600 (Deye-Logger, Solarman V5)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = -DCORE_DEBUG_LEVEL=1

; Update per WLAN (nach dem ersten Flashen per USB):
;   pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = solarmonitor.local
upload_flags = --auth=${sysenv.SOLAR_OTA_PASS}
